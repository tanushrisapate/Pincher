<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincher Upload</title>

    <link rel="stylesheet" href="./css/pages/upload.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">
            <img src="./assets/icons/pincher.png" alt="">
        </div>

        <nav class="menu">

            <a href="dashboard.html">
                Overview
            </a>

            <a href="upload.html">
                Upload
            </a>

            <a href="#" class="active">
                 History
            </a>

            <a href="#">
                Favorites
            </a>

            <a href="#">
                Settings
            </a>

        </nav>

        <a href="#" class="logout">
             Logout
        </a>

    </aside>

    <main class="content">

        <div class="topbar">

            <div></div>

            <div class="profile">

                <span class="bell">🔔</span>

                <img src="https://i.pravatar.cc/100" alt="">

            </div>

        </div>

        <h1>Upload Your Outfit</h1>

        <p class="subtitle">
            Upload a clear image of your outfit
        </p>

        <div class="upload-box">

            <div class="upload-content">

                <div class="upload-icon">
                    ☁
                </div>

                <h3>Drag & drop your image here</h3>

                <span>or</span>

                <label class="upload-btn">
                    Choose Image
                    <input type="file" hidden>
                </label>

                <p>JPG, PNG up to 5MB</p>

            </div>

        </div>

        <div class="tips-card">

            <h4>Tips for better results</h4>

            <div class="tips">

                <div class="tip">
                    💡
                    <span>Good lighting</span>
                </div>

                <div class="tip">
                    👕
                    <span>Full outfit visible</span>
                </div>

                <div class="tip">
                    👤
                    <span>No cluttered background</span>
                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
