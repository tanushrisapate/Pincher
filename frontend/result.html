<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincher Result</title>

    <link rel="stylesheet" href="./css/pages/result.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="result-card">

        <div class="heading">
            <h1>Your Result</h1>
            <p>Here are the best matches for your outfit</p>
        </div>

        <div class="result-layout">

            <!-- LEFT SIDE -->

            <div class="outfit-section">

                <div class="outfit-image">

                    <span class="match-badge">
                        94% Match
                    </span>

                    <img src="./assets/images/outfit-result.jpg" alt="Outfit">

                </div>

                <div class="action-buttons">

                    <button class="save-btn">
                        💾 Save Outfit
                    </button>

                    <button class="try-btn">
                        ✨ Try Another
                    </button>

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="recommend-section">

                <h3>Recommended For You</h3>

                <div class="products">

                    <!-- PRODUCT 1 -->

                    <div class="product-card">

                        <span class="score">
                            92%
                        </span>

                        <img src="./assets/images/blazer.png" alt="">

                        <p class="price">₹2,499</p>

                    </div>

                    <!-- PRODUCT 2 -->

                    <div class="product-card">

                        <span class="score">
                            92%
                        </span>

                        <img src="./assets/images/bag.png" alt="">

                        <p class="price">₹1,899</p>

                    </div>

                    <!-- PRODUCT 3 -->

                    <div class="product-card">

                        <span class="score">
                            90%
                        </span>

                        <img src="./assets/images/shoes.png" alt="">

                        <p class="price">₹1,399</p>

                    </div>

                    <!-- PRODUCT 4 -->

                    <div class="product-card">

                        <span class="score">
                            98%
                        </span>

                        <img src="./assets/images/jeans.png" alt="">

                        <p class="price">₹2,199</p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
